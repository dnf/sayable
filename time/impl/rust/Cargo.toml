[package]
name = "sayable-time"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "Human-friendly clock time formatting — how people actually say the time"
license = "MIT"
authors = ["Don Neufeld"]
repository = "https://github.com/dnf/sayable"
homepage = "https://github.com/dnf/sayable"
documentation = "https://docs.rs/sayable-time"
readme = "README.md"
keywords = ["time", "clock", "format", "natural-language", "locale"]
categories = ["date-and-time"]

[dependencies]
# Zero dependencies — uses only std library

[dev-dependencies]
# No dev dependencies needed — uses #[cfg(test)] modules

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these common pedantic false positives for this library
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"             # used for locale re-exports
manual_string_new = "allow"            # String::from("") is fine
needless_pass_by_value = "allow"       # function pointer args
cast_sign_loss = "allow"               # i32→usize for hour index (always 0-11)
