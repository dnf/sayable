[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sayable-time"
version = "0.5.0"
description = "Human-friendly clock time formatting — tells time the way people talk"
readme = "../../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Don Neufeld" }]
keywords = [
  "time", "clock", "format",
  "human-readable", "natural-language",
  "hours", "minutes",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dnf/sayable"
Documentation = "https://github.com/dnf/sayable/tree/main/time/impl/python#readme"
Issues = "https://github.com/dnf/sayable/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sayable_time"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "pyright>=1.1"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "SIM",       # flake8-simplify
  "TCH",       # flake8-type-checking
  "RUF",       # ruff-specific
]
ignore = [
  "RUF001",   # ambiguous Unicode chars — expected in i18n locale strings
  "RUF003",   # ambiguous Unicode in comments
  "SIM108",   # ternary suggestions
]

[tool.ruff.lint.per-file-ignores]
"src/sayable_time/locales/*.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
