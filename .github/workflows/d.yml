name: D

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dmd comes from downloads.dlang.org, which has outages lasting hours,
        # so it is pinned and cached, and a failed download only warns. ldc
        # comes from GitHub releases and runs the CLI checks and fuzzing.
        # Bump the dmd version when a new one is released.
        dc: [dmd-2.113.0, ldc-latest]
    defaults:
      run:
        working-directory: age/impl/d
    steps:
      - uses: actions/checkout@v4
      # setup-dlang looks in the runner's tool cache before downloading.
      - uses: actions/cache@v4
        if: startsWith(matrix.dc, 'dmd-')
        with:
          path: ${{ runner.tool_cache }}/dmd
          key: ${{ matrix.dc }}-${{ runner.os }}-${{ runner.arch }}
      - uses: dlang-community/setup-dlang@v2
        id: setup
        continue-on-error: ${{ startsWith(matrix.dc, 'dmd-') }}
        with:
          compiler: ${{ matrix.dc }}
      - name: Skip dmd when downloads.dlang.org is down
        if: steps.setup.outcome == 'failure'
        run: echo "::warning::Couldn't download ${{ matrix.dc }} from downloads.dlang.org, so its tests were skipped"
      - name: Test age library
        if: steps.setup.outcome == 'success'
        run: dub test
      - name: Test date library
        if: steps.setup.outcome == 'success'
        working-directory: date/impl/d
        run: dub test
      - name: Test duration library
        if: steps.setup.outcome == 'success'
        working-directory: duration/impl/d
        run: dub test
      - name: Test time library
        if: steps.setup.outcome == 'success'
        working-directory: time/impl/d
        run: dub test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: bash cli/impl/d/build.sh
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/d/sayable && bash cli/test-harness.sh cli/impl/d/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: python3 cli/fuzz.py --langs d -n 2000
