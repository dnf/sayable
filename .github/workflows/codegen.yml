name: Codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m codegen.generate --check
        working-directory: age
      # hecatron (https://github.com/dnf/hecatron) checks the generated
      # Dockerfile and workflows; pinned so a hecatron change can't break CI.
      - name: Install hecatron
        uses: actions/checkout@v4
        with:
          repository: dnf/hecatron
          ref: v0.2.1
          path: .hecatron-tool
      - run: echo "${GITHUB_WORKSPACE}/.hecatron-tool/bin" >> "${GITHUB_PATH}"
      - name: Generated Dockerfile and workflows are current, and every workflow tests every component
        run: hecatron check
      - name: Every native suite implements every canonical test
        run: python tools/check_test_ids.py
      - name: shellcheck every shell script
        run: hecatron lint shell
