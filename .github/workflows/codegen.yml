name: Codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m codegen.generate --check
        working-directory: age
      - name: Every language workflow tests every component it implements
        run: python tools/check_workflow_components.py
      - name: Every native suite implements every canonical test
        run: python tools/check_test_ids.py
      - name: shellcheck every shell script
        run: bash .hecatron/tools/lint/shellcheck.sh
