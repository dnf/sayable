name: Mojo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/mojo
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          run-install: false
      - name: Install Mojo
        run: |
          pixi init -c https://conda.modular.com/max/ -c conda-forge .
          pixi add mojo
      - name: Run tests
        run: pixi run mojo run -I src tests/test_format_age.mojo
