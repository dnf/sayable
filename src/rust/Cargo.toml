[package]
name = "parent-time"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "A thoughtful time formatting library that reflects how we think about little ones"
license = "MIT"
authors = ["Don Neufeld"]
repository = "https://github.com/dnf/parent-time"
homepage = "https://github.com/dnf/parent-time"
documentation = "https://docs.rs/parent-time"
readme = "README.md"
keywords = ["age", "format", "parent", "baby", "time"]
categories = ["date-and-time"]

[dependencies]
# Zero dependencies — uses only std library

[dev-dependencies]
# No dev dependencies needed — uses #[cfg(test)] modules

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these common pedantic false positives for this library
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"             # used for locale re-exports
unreadable_literal = "allow"           # date algorithm constants
match_same_arms = "allow"              # clearer to list month lengths explicitly
cast_possible_truncation = "allow"     # i64→i32 for year values (safe range)
cast_possible_wrap = "allow"           # u64→i64 for timestamps (safe range)
cast_sign_loss = "allow"               # needed for date arithmetic
too_many_lines = "allow"               # formatter function is naturally long
manual_string_new = "allow"            # String::from("") is fine
missing_fields_in_debug = "allow"      # locale debug omits function pointers
needless_pass_by_value = "allow"       # function pointer args
