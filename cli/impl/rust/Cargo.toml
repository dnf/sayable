[package]
name = "sayable"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "sayable"
path = "src/main.rs"

[dependencies]
sayable-age = { path = "../../../age/impl/rust" }
sayable-date = { path = "../../../date/impl/rust" }
sayable-time = { path = "../../../time/impl/rust" }
sayable-duration = { path = "../../../duration/impl/rust" }

[profile.release]
strip = true
lto = true
