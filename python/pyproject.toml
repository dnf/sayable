[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parent-time"
version = "0.1.0"
description = "Human-friendly age formatting the way parents actually talk — weeks+days for newborns, months for babies, years+months for toddlers"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Don Neufeld" }]
keywords = [
  "age", "baby", "infant", "child", "format",
  "human-readable", "pediatric", "weeks", "months",
  "days", "parent", "toddler", "newborn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/donalvarez/parent-time"

[tool.hatch.build.targets.wheel]
packages = ["src/parent_time"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
