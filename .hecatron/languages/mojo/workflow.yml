name: Mojo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/mojo
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          run-install: false
      - name: Install Mojo
        run: |
          pixi init -c https://conda.modular.com/max/ -c conda-forge .
          pixi add "mojo==0.26.1.0"
      - name: Run tests
        run: pixi run mojo run -I src tests/test_format_age.mojo

      # Reuse the Mojo environment installed in age/impl/mojo above.
      - name: Test date library
        working-directory: date/impl/mojo
        run: pixi run --manifest-path "${GITHUB_WORKSPACE}/age/impl/mojo/pixi.toml" mojo run -I "${PWD}/src" "${PWD}/tests/test_format_date.mojo"
      - name: Test duration library
        working-directory: duration/impl/mojo
        run: pixi run --manifest-path "${GITHUB_WORKSPACE}/age/impl/mojo/pixi.toml" mojo run -I "${PWD}/src" "${PWD}/tests/test_format_duration.mojo"
      - name: Test time library
        working-directory: time/impl/mojo
        run: pixi run --manifest-path "${GITHUB_WORKSPACE}/age/impl/mojo/pixi.toml" mojo run -I "${PWD}/src" "${PWD}/tests/test_format_time.mojo"

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: bash cli/impl/mojo/build.sh
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/mojo/sayable && bash cli/test-harness.sh cli/impl/mojo/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs mojo -n 2000
