name: Java

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: ./gradlew test

      # The component projects don't commit a Gradle wrapper jar
      # (impl/.gitignore), so they run with the Gradle that setup-gradle installs.
      - name: Test date library
        working-directory: date/impl/java
        run: gradle test
      - name: Test duration library
        working-directory: duration/impl/java
        run: gradle test
      - name: Test time library
        working-directory: time/impl/java
        run: gradle test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/java/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/java/sayable && bash cli/test-harness.sh cli/impl/java/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs java -n 2000
